services:
  - type: web
    name: sentinel-security
    env: docker  # <--- Changed from 'python' to 'docker'
    plan: free
    startCommand: null # Dockerfile handles the start command
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: false
      - key: MEDIAPIPE_MODEL_PATH
        value: pose_landmarker_heavy.task